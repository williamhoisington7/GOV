name: Build Signature Manager EXE

on:
  push:
    branches: [main, master, "copilot/**"]
    paths:
      - "signature_tool/**"
      - ".github/workflows/build-signature-exe.yml"
  pull_request:
    paths:
      - "signature_tool/**"
      - ".github/workflows/build-signature-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test
        run: python signature_tool/signature_manager.py --self-test

  windows-exe:
    runs-on: windows-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip && python -m pip install -r signature_tool/requirements-build.txt
      - name: Build EXE
        working-directory: signature_tool
        run: |
          python signature_manager.py --self-test
          python -m PyInstaller --noconfirm PiedonianSignatureManager.spec
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiedonianSignatureManager-windows
          path: signature_tool/dist/PiedonianSignatureManager.exe
          if-no-files-found: error
      - name: Push EXE to GitHub Releases
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2.3.2
        with:
          tag_name: windows-signature-manager
          name: Piedonian Signature Manager (Windows)
          target_commitish: ${{ github.sha }}
          body: |
            Windows Signature Manager EXE built from `${{ github.sha }}`.

            Download **PiedonianSignatureManager.exe** and run it on Windows.
            Signature records are stored in `data\civic_signatures.json` beside the EXE.
          files: |
            signature_tool/dist/PiedonianSignatureManager.exe
          fail_on_unmatched_files: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
