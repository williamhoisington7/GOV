name: Build Civic Document EXE

on:
  push:
    branches: [main, master, "copilot/**"]
    paths:
      - "PiedonianCivicDocument/**"
      - "CONSTITUTION_OF_THE_PIEDONIAN_WOODS.md"
      - "SIGNATURE_PACKET.md"
      - "PIEDONIAN_COMBINED_CIVIC_DOCUMENT.md"
      - ".github/workflows/build-civic-document-exe.yml"
  pull_request:
    paths:
      - "PiedonianCivicDocument/**"
      - "CONSTITUTION_OF_THE_PIEDONIAN_WOODS.md"
      - "SIGNATURE_PACKET.md"
      - "PIEDONIAN_COMBINED_CIVIC_DOCUMENT.md"
      - ".github/workflows/build-civic-document-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Sync content copies
        run: |
          cp CONSTITUTION_OF_THE_PIEDONIAN_WOODS.md PiedonianCivicDocument/Content/
          cp SIGNATURE_PACKET.md PiedonianCivicDocument/Content/
          cp PIEDONIAN_COMBINED_CIVIC_DOCUMENT.md PiedonianCivicDocument/Content/
      - name: Self-test
        working-directory: PiedonianCivicDocument
        run: dotnet run -- --self-test

  windows-exe:
    runs-on: windows-latest
    needs: test
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Sync content copies
        shell: pwsh
        run: |
          Copy-Item CONSTITUTION_OF_THE_PIEDONIAN_WOODS.md PiedonianCivicDocument/Content/
          Copy-Item SIGNATURE_PACKET.md PiedonianCivicDocument/Content/
          Copy-Item PIEDONIAN_COMBINED_CIVIC_DOCUMENT.md PiedonianCivicDocument/Content/
      - name: Publish Windows portable package
        working-directory: PiedonianCivicDocument
        shell: pwsh
        run: |
          dotnet run -- --self-test
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          if (Test-Path package) { Remove-Item -Recurse -Force package }
          New-Item -ItemType Directory -Path dist, package | Out-Null
          dotnet publish -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o dist
          Get-ChildItem dist -Filter *.pdb -ErrorAction SilentlyContinue | Remove-Item -Force
          Get-ChildItem dist -Filter *.xml -ErrorAction SilentlyContinue | Remove-Item -Force
          New-Item -ItemType Directory -Path dist/data -Force | Out-Null
          New-Item -ItemType File -Path dist/data/.gitkeep -Force | Out-Null
          # Full portable package — EXE alone is not enough (needs wwwroot + Content)
          $packageName = "PiedonianCivicDocument-windows-x64"
          $stage = "package/$packageName"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Path dist/* -Destination $stage -Recurse -Force
          Compress-Archive -Path "$stage/*" -DestinationPath "package/$packageName.zip" -Force
          if (-not (Test-Path "package/$packageName.zip")) { throw "ZIP missing" }
          if (-not (Test-Path "dist/PiedonianCivicDocument.exe")) { throw "EXE missing" }
          if (-not (Test-Path "dist/wwwroot/index.html")) { throw "wwwroot missing" }
          if (-not (Test-Path "dist/Content/PIEDONIAN_COMBINED_CIVIC_DOCUMENT.md")) { throw "Content missing" }
          Get-ChildItem package, dist | Format-Table Name, Length
      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiedonianCivicDocument-windows-x64
          path: PiedonianCivicDocument/package/PiedonianCivicDocument-windows-x64.zip
          if-no-files-found: error
      - name: Upload unpacked folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiedonianCivicDocument-windows-folder
          path: PiedonianCivicDocument/dist/
          if-no-files-found: error
      - name: Push package to GitHub Releases
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2.3.2
        with:
          tag_name: windows-civic-document
          name: Piedonian Civic Document (Windows)
          target_commitish: ${{ github.sha }}
          body: |
            Portable Windows 11 package built from `${{ github.sha }}`.

            Download **PiedonianCivicDocument-windows-x64.zip**, unzip, and run `PiedonianCivicDocument.exe`.
            Keep `wwwroot\`, `Content\`, and `data\` beside the EXE.
          files: |
            PiedonianCivicDocument/package/PiedonianCivicDocument-windows-x64.zip
          fail_on_unmatched_files: true
          # Rolling tag, not a semver release — leave the repo "latest" badge unset.
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
